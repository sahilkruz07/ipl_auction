{% extends "base.html" %}
{% block title %}Bet Matrix · IPL 2027 Auction Game{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4 class="m-0">All Users' Bets</h4>
    <small class="text-muted" id="updated"></small>
  </div>
  <div id="locked" class="alert alert-info d-none">Everyone's bets are revealed once the admin locks betting and the auction starts.</div>
  <div class="table-responsive matrix-wrap">
    <table class="table table-bordered align-middle shadow-sm matrix" id="matrix"></table>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ asset('reveal.js') }}"></script>{% endblock %}
