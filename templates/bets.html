{% extends "base.html" %}
{% block title %}My Bets · IPL 2027 Auction Game{% endblock %}
{% block content %}
<div class="team-bar" id="teamBar" aria-label="Your remaining budget per team"></div>
<div class="container-fluid py-3">
  <div id="lockBanner" class="alert alert-warning d-none">
    Betting is locked. <a href="{{ url_for('reveal_page') }}" class="alert-link">See the bet matrix</a> or the
    <a href="{{ url_for('leaderboard_page') }}" class="alert-link">leaderboard</a>.
  </div>
  <div class="row g-2 align-items-end mb-3">
    <div class="col-12 col-md-3"><input id="fSearch" class="form-control" placeholder="Search player…"></div>
    <div class="col-6 col-md-2">
      <select id="fRole" class="form-select">
        <option value="">All roles</option><option>batter</option><option>bowler</option>
        <option>allrounder</option><option>wicket keeper</option>
      </select>
    </div>
    <div class="col-6 col-md-2">
      <select id="fOrigin" class="form-select">
        <option value="">Indian + Overseas</option><option value="indian">Indian</option><option value="overseas">Overseas</option>
      </select>
    </div>
    <div class="col-6 col-md-2">
      <select id="fStatus" class="form-select">
        <option value="">All</option><option value="bet">Bet Placed</option><option value="pending">Pending</option>
      </select>
    </div>
    <div class="col-6 col-md-3 text-md-end">
      <span class="fw-semibold" id="progressText"></span>
      <div class="progress mt-1" style="height:6px"><div class="progress-bar bg-success" id="progressBar"></div></div>
    </div>
  </div>
  <div class="tile-grid" id="playerRows"><div class="empty">Loading…</div></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ asset('bets.js') }}"></script>{% endblock %}
